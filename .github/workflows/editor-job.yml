
name: editor-job

"on":
  workflow_dispatch:
    inputs:
      job_id:
        description: Editor job number
        required: true
        type: string

permissions: {}

concurrency:
  group: editor-jobs
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev && npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium

      - name: Run job
        env:
          JOB_ID: ${{ inputs.job_id }}
          EDITOR_API: ${{ vars.EDITOR_API }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: node runner/run-job.js
